{% extends "base.html" %}{% block title %}Create doctor{% endblock %}{% block content %}
<div class="form-card card shadow-sm"><div class="card-body p-4"><h1 class="h3">Create doctor account</h1><p class="text-secondary">Doctor accounts can only be created by an administrator.</p><form method="post">{% csrf_token %}
{% for name,label,type in fields %}{% endfor %}
<div class="row g-3"><div class="col-md-6"><label class="form-label">Username *</label><input class="form-control" name="username" required></div><div class="col-md-6"><label class="form-label">Email *</label><input class="form-control" name="email" type="email" required></div><div class="col-md-6"><label class="form-label">First name *</label><input class="form-control" name="first_name" required></div><div class="col-md-6"><label class="form-label">Last name *</label><input class="form-control" name="last_name" required></div><div class="col-md-6"><label class="form-label">Temporary password *</label><input class="form-control" name="password" type="password" required minlength="8"></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone"></div><div class="col-md-6"><label class="form-label">Specialization *</label><input class="form-control" name="specialization" required></div><div class="col-md-6"><label class="form-label">Experience (years)</label><input class="form-control" name="experience" type="number" min="0" value="0"></div><div class="col-12"><label class="form-label">Availability</label><textarea class="form-control" name="availability" rows="2"></textarea></div></div><button class="btn btn-primary mt-3">Create doctor</button></form></div></div>{% endblock %}
